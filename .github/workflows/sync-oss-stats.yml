name: Sync OSS stats

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-oss-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Refresh stat line from ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import base64, json, os, re, urllib.request
          token = os.environ["GITHUB_TOKEN"]
          req = urllib.request.Request(
              "https://api.github.com/repos/devtechedge/oss-contributions/contents/docs/triage/publications.json",
              headers={"Accept": "application/vnd.github+json",
                       "X-GitHub-Api-Version": "2022-11-28",
                       "Authorization": f"Bearer {token}",
                       "User-Agent": "devtechedge-site-stats-sync"})
          with urllib.request.urlopen(req, timeout=30) as res:
              payload = json.load(res)
          pubs = json.loads(base64.b64decode(payload["content"]).decode("utf-8"))
          recs = pubs.get("records", [])
          n = len(recs)
          repos = sorted({r["repo"] for r in recs})
          path = "index.html"
          with open(path, encoding="utf-8") as f:
              text = f.read()
          new, count = re.subn(
              r"<strong>\d+ merged PRs</strong> across <strong>\d+</strong> upstream projects\.",
              f"<strong>{n} merged PRs</strong> across <strong>{len(repos)}</strong> upstream projects.",
              text)
          if count == 0:
              raise SystemExit("stat line anchor not found")
          if new != text:
              with open(path, "w", encoding="utf-8", newline="\n") as f:
                  f.write(new)
              print(f"updated: {n} PRs across {len(repos)} repos")
          else:
              print(f"no change: {n} PRs across {len(repos)} repos")
          EOF

      - name: Commit stat if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No stat changes"
            exit 0
          fi
          git commit -m "chore(site): sync OSS stats from ledger"
          for attempt in 1 2 3; do
            if git push origin "HEAD:main"; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; rebasing onto latest main"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::rebase conflict while syncing site stats"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "::error::could not push site stats after 3 attempts"
          exit 1
