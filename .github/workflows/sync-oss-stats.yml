name: Sync OSS stats

on:
  repository_dispatch:
    types: [oss-stats-refresh]
  workflow_dispatch:
    inputs:
      merged_count:
        description: Authored merged pull request count
        required: true
        type: string
      repo_count:
        description: Distinct upstream project count
        required: true
        type: string

concurrency:
  group: sync-oss-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Refresh stat line from ledger
        env:
          MERGED_COUNT: ${{ github.event.client_payload.merged_count || github.event.inputs.merged_count }}
          REPO_COUNT: ${{ github.event.client_payload.repo_count || github.event.inputs.repo_count }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import os, re
          n = os.environ.get("MERGED_COUNT", "")
          repos = os.environ.get("REPO_COUNT", "")
          if not n.isdigit() or not repos.isdigit():
              raise SystemExit("merged_count and repo_count must be integers")
          path = "index.html"
          with open(path, encoding="utf-8") as f:
              text = f.read()
          new, count = re.subn(
              r"<strong>\d+ merged PRs</strong> across <strong>\d+</strong> upstream projects\.",
              f"<strong>{int(n)} merged PRs</strong> across <strong>{int(repos)}</strong> upstream projects.",
              text)
          if count == 0:
              raise SystemExit("stat line anchor not found")
          if new != text:
              with open(path, "w", encoding="utf-8", newline="\n") as f:
                  f.write(new)
              print(f"updated: {int(n)} PRs across {int(repos)} repos")
          else:
              print(f"no change: {int(n)} PRs across {int(repos)} repos")
          EOF

      - name: Commit stat if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No stat changes"
            exit 0
          fi
          git commit -m "chore(site): sync OSS stats from ledger"
          for attempt in 1 2 3; do
            if git push origin "HEAD:main"; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; rebasing onto latest main"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::rebase conflict while syncing site stats"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "::error::could not push site stats after 3 attempts"
          exit 1
